# Yedek yayin: Vercel'e ek olarak GitHub Pages'e de kurar.
# Amac dayaniklilik - iki bagimsiz sirket, iki adres, tek kaynak.
name: GitHub Pages (yedek yayın)

# Her push'ta calisir; yayin adimi sadece VARSAYILAN dalda yapilir.
# Boylece dalin adi "main" olsun ya da baska bir sey olsun, calisir.
on:
  push:
  workflow_dispatch:          # Actions sekmesinden elle de calistirilabilir

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Depo adi "blog" oldugu icin site alt dizinde yayinlanir:
      # https://alperalyaz.github.io/blog/
      # Gorsel ve baglantilarin kirilmamasi icin adresi burada bildiriyoruz.
      - run: npm run build
        env:
          SITE_URL: https://alperalyaz.github.io
          BASE_PATH: /blog/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    # Sadece varsayilan dal yayinlanir - deneme dallari siteyi bozmasin.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
