# Siteyi GitHub Pages'e kurar.
#
# Adres depo adindan OTOMATIK hesaplanir:
#   depo adi "blog"                -> https://alperalyaz.github.io/blog/
#   depo adi "alperalyaz.github.io" -> https://alperalyaz.github.io/
# Yani depoyu yeniden adlandirirsan burada hicbir sey degistirmen gerekmez.
name: GitHub Pages

on:
  push:
  workflow_dispatch:          # Actions sekmesinden elle de calistirilabilir

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Yayın adresini hesapla
        id: adres
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          repo="${{ github.event.repository.name }}"
          repo_lc=$(echo "$repo" | tr '[:upper:]' '[:lower:]')
          site="https://${owner}.github.io"
          if [ "$repo_lc" = "${owner}.github.io" ]; then
            base="/"                 # kullanici sitesi: kok dizinde yayinlanir
          else
            base="/${repo}/"         # proje sitesi: alt dizinde yayinlanir
          fi
          echo "site=$site" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "Yayın adresi: ${site}${base}"

      - run: npm run build
        env:
          SITE_URL: ${{ steps.adres.outputs.site }}
          BASE_PATH: ${{ steps.adres.outputs.base }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    # Sadece varsayilan dal yayinlanir - deneme dallari siteyi bozmasin.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
